# =============================================================================
# Logstash — Pipeline de ingestão de logs
# =============================================================================
# Recebe logs de duas fontes e envia para Elasticsearch em índices diários.
#
# Inputs:
#   - Beats (porta 5044): Filebeat, Winlogbeat, Auditbeat, etc.
#   - Syslog (porta 5140): dispositivos de rede, firewalls, switches
#     (mapeada para 514 no host via docker-compose)
#
# Output:
#   - Elasticsearch HTTPS com autenticação e TLS
#   - Índice diário: logs-YYYY.MM.dd
# =============================================================================

input {

  # ---------------------------------------------------------------------------
  # Beats — Filebeat, Winlogbeat, Auditbeat, etc.
  # ---------------------------------------------------------------------------
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.key"
  }

  # ---------------------------------------------------------------------------
  # Syslog TCP — dispositivos de rede, firewalls, switches
  # ---------------------------------------------------------------------------
  syslog {
    port => 5140
    type => "syslog"
    codec => "plain"
  }

  # ---------------------------------------------------------------------------
  # Syslog UDP — mesma porta, protocolo UDP (mais comum em dispositivos de rede)
  # ---------------------------------------------------------------------------
  udp {
    port => 5140
    type => "syslog"
    codec => "plain"
  }
}

filter {

  # ---------------------------------------------------------------------------
  # Enriquecimento de logs syslog
  # ---------------------------------------------------------------------------
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:source_host} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}"
      }
      overwrite => ["message"]
    }
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    }
    mutate {
      add_field => { "log_source" => "syslog" }
    }
  }

  # ---------------------------------------------------------------------------
  # Classificação de severidade por palavras-chave
  # ---------------------------------------------------------------------------
  if [message] =~ /(?i)(error|critical|panic|fatal|failed|failure|oom|segfault)/ {
    mutate { add_field => { "severity" => "ERROR" } }
  } else if [message] =~ /(?i)(warn|warning|degraded|retry|timeout)/ {
    mutate { add_field => { "severity" => "WARNING" } }
  } else {
    mutate { add_field => { "severity" => "INFO" } }
  }
}

output {

  # ---------------------------------------------------------------------------
  # Elasticsearch — índice diário com TLS e autenticação
  # ---------------------------------------------------------------------------
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    index => "logs-%{+YYYY.MM.dd}"
  }
}
