# =============================================================================
# Promtail — Coleta e classificação de logs
# =============================================================================
# O Promtail lê logs de arquivos locais e containers Docker, classifica cada
# linha por severidade (INFO/WARNING/ERROR) e envia para o Loki.
#
# Jobs configurados:
#   1. system   — /var/log/syslog (eventos do sistema operacional)
#   2. auth     — /var/log/auth.log (autenticação, sudo, SSH)
#   3. kernel   — /var/log/kern.log (mensagens do kernel)
#   4. docker   — containers via Docker socket (service discovery)
#   5. security — /var/log/auth.log (visão focada em eventos de segurança)
#
# NOTA: Os jobs "auth" e "security" leem o mesmo arquivo (/var/log/auth.log)
# com pipelines diferentes. O job "auth" classifica ações gerais, enquanto
# "security" foca em detecção de eventos de segurança. Isso resulta em
# ingestão duplicada do auth.log — aceito para manter dashboards separados.
#
# Documentação: https://grafana.com/docs/loki/latest/send-data/promtail/
# =============================================================================

server:
  http_listen_port: 9080   # API interna do Promtail (métricas, health)
  grpc_listen_port: 0      # Desabilitado (não usado em modo push)

# Arquivo de posições — registra até onde cada arquivo de log foi lido.
# Garante que o Promtail retome de onde parou após reinícios.
positions:
  filename: /tmp/positions.yaml

# Destino dos logs coletados — endpoint de push do Loki.
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ===========================================================================
  # Job: system — Logs do sistema operacional (syslog)
  # ===========================================================================
  # Coleta eventos gerais do sistema: serviços, cron, boot, etc.
  # Classificação por severidade baseada em palavras-chave no texto do log.
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          host: monitoring-host
          __path__: /var/log/syslog
    pipeline_stages:
      # Nível padrão: INFO (será sobrescrito se detectar padrões abaixo)
      - static_labels:
          level: INFO
      # Detecta warnings: degraded, retry, timeout, etc.
      - match:
          selector: '{job="system"} |~ "(?i)(warn|warning|degraded|retry|timeout)"'
          stages:
            - static_labels:
                level: WARNING
      # Detecta erros: critical, panic, fatal, failed, etc.
      - match:
          selector: '{job="system"} |~ "(?i)(error|critical|panic|fatal|failed|failure)"'
          stages:
            - static_labels:
                level: ERROR

  # ===========================================================================
  # Job: auth — Logs de autenticação e acesso
  # ===========================================================================
  # Coleta eventos de login, sudo, SSH e sessões.
  # Extrai a ação específica como label para filtragem granular.
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          host: monitoring-host
          __path__: /var/log/auth.log
    pipeline_stages:
      # Extrai o tipo de ação do log (Failed password, sudo, session, etc.)
      - regex:
          expression: '.*(?P<action>Failed password|Accepted password|session opened|session closed|sudo:|COMMAND=|Invalid user|authentication failure).*'
      # Adiciona a ação extraída como label "action" no Loki
      - labels:
          action:
      # Nível padrão: INFO
      - static_labels:
          level: INFO
      # Escalona para WARNING: comandos sudo, conexões fechadas
      - match:
          selector: '{job="auth"} |~ "(?i)(sudo:|COMMAND=|Connection closed by authenticating user)"'
          stages:
            - static_labels:
                level: WARNING
      # Escalona para ERROR: falhas de autenticação
      - match:
          selector: '{job="auth"} |~ "(?i)(Failed password|Invalid user|authentication failure|error|failed)"'
          stages:
            - static_labels:
                level: ERROR

  # ===========================================================================
  # Job: kernel — Mensagens do kernel Linux
  # ===========================================================================
  # Coleta eventos do kernel: hardware, drivers, OOM, segfaults, etc.
  - job_name: kernel
    static_configs:
      - targets: [localhost]
        labels:
          job: kernel
          host: monitoring-host
          __path__: /var/log/kern.log
    pipeline_stages:
      # Nível padrão: INFO
      - static_labels:
          level: INFO
      # Detecta warnings: taint, throttling, degraded
      - match:
          selector: '{job="kernel"} |~ "(?i)(warn|warning|taint|throttl|degraded)"'
          stages:
            - static_labels:
                level: WARNING
      # Detecta erros: OOM killer, segfaults, panics
      - match:
          selector: '{job="kernel"} |~ "(?i)(error|critical|panic|fatal|oom|segfault|fail)"'
          stages:
            - static_labels:
                level: ERROR

  # ===========================================================================
  # Job: docker — Logs de containers Docker
  # ===========================================================================
  # Usa Docker service discovery para coletar logs de todos os containers
  # automaticamente. Novos containers são detectados a cada 30 segundos.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s    # Intervalo de descoberta de novos containers
    relabel_configs:
      # Extrai metadados do container como labels no Loki
      - source_labels: ['__meta_docker_container_name']
        target_label: container          # Nome do container
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id       # ID único do container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream             # stdout ou stderr
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service    # Nome do serviço no docker-compose
      # Adiciona label de host para consistência com outros jobs
      - target_label: host
        replacement: monitoring-host
    pipeline_stages:
      # Nível padrão: INFO
      - static_labels:
          level: INFO
      # Detecta warnings em logs de containers
      - match:
          selector: '{job="docker"} |~ "(?i)(warn|warning|deprecated|retry|timeout)"'
          stages:
            - static_labels:
                level: WARNING
      # stderr não é necessariamente ERROR — muitos apps escrevem output
      # normal em stderr. Classificamos como ERROR mas isso pode gerar
      # falsos positivos.
      - match:
          selector: '{job="docker",stream="stderr"}'
          stages:
            - static_labels:
                level: ERROR
      # Detecta erros explícitos em qualquer stream
      - match:
          selector: '{job="docker"} |~ "(?i)(error|critical|panic|fatal|failed|exception|traceback)"'
          stages:
            - static_labels:
                level: ERROR

  # ===========================================================================
  # Job: security — Detecção de eventos de segurança
  # ===========================================================================
  # Lê o mesmo auth.log que o job "auth", mas com pipeline focada em
  # categorizar eventos de segurança para o dashboard de monitoramento.
  #
  # NOTA: Gera ingestão duplicada do auth.log. Mantido separado para
  # permitir queries independentes (job="security") nos dashboards.
  - job_name: security
    static_configs:
      - targets: [localhost]
        labels:
          job: security
          host: monitoring-host
          __path__: /var/log/auth.log
    pipeline_stages:
      # Extrai ações de segurança relevantes
      - regex:
          expression: '.*(?P<action>Failed password|Accepted password|session opened|session closed|sudo:|COMMAND=|Invalid user|Connection closed by authenticating user|authentication failure).*'
      - labels:
          action:
      # Nível padrão: INFO
      - static_labels:
          level: INFO
      # Escalona para WARNING: atividade de sudo e conexões suspeitas
      - match:
          selector: '{job="security"} |~ "(?i)(sudo:|COMMAND=|Connection closed by authenticating user)"'
          stages:
            - static_labels:
                level: WARNING
      # Escalona para ERROR: falhas de autenticação (possíveis ataques)
      - match:
          selector: '{job="security"} |~ "(?i)(Failed password|Invalid user|authentication failure)"'
          stages:
            - static_labels:
                level: ERROR
