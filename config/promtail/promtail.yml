# =============================================================================
# Promtail — Coleta e classificação de logs
# =============================================================================
# O Promtail lê logs do systemd-journal e containers Docker, classifica cada
# linha por severidade (INFO/WARNING/ERROR) e envia para o Loki.
#
# Jobs configurados:
#   1. journal  — systemd-journal (sistema, auth, kernel via journald)
#   2. docker   — containers via Docker socket (service discovery)
#
# Este host Debian 12 usa journald (sem rsyslog). Os logs de sistema,
# autenticação e kernel são todos lidos via journal scrape config.
# O campo SYSLOG_IDENTIFIER do journal é usado para classificar a origem.
#
# Documentação: https://grafana.com/docs/loki/latest/send-data/promtail/
# =============================================================================

server:
  http_listen_port: 9080   # API interna do Promtail (métricas, health)
  grpc_listen_port: 0      # Desabilitado (não usado em modo push)

# Arquivo de posições — registra até onde cada fonte de log foi lida.
# Garante que o Promtail retome de onde parou após reinícios.
positions:
  filename: /tmp/positions.yaml

# Destino dos logs coletados — endpoint de push do Loki.
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ===========================================================================
  # Job: journal — Logs do systemd-journal (sistema, auth, kernel)
  # ===========================================================================
  # Lê diretamente do journald — cobre syslog, autenticação, kernel e todos
  # os serviços gerenciados pelo systemd. Elimina a necessidade de múltiplos
  # jobs lendo arquivos separados (que não existem sem rsyslog).
  #
  # Labels extraídas do journal:
  #   - __journal__systemd_unit → unit (ex: ssh.service, cron.service)
  #   - __journal_syslog_identifier → syslog_identifier (ex: sudo, sshd, kernel)
  #   - __journal_priority → usado no pipeline para classificar severidade
  - job_name: journal
    journal:
      path: /var/log/journal       # Diretório persistente do journald
      max_age: 12h                 # Só ingere entradas das últimas 12h no startup
      labels:
        job: system                # Label base — pipeline reclassifica para auth/kernel
        host: monitoring-host
    relabel_configs:
      # Extrai a unidade systemd como label (ex: ssh.service)
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      # Extrai o identificador syslog (ex: sshd, sudo, kernel, CRON)
      - source_labels: ['__journal_syslog_identifier']
        target_label: syslog_identifier
    pipeline_stages:
      # -----------------------------------------------------------------
      # Classificação de job baseada no identificador syslog
      # -----------------------------------------------------------------
      # Reclassifica o job base "system" para categorias específicas,
      # permitindo filtrar por job="auth", job="kernel" nos dashboards.

      # Kernel: mensagens do kernel Linux (OOM, hardware, drivers)
      - match:
          selector: '{job="system"}'
          stages:
            - regex:
                source: syslog_identifier
                expression: '^(?P<is_kernel>kernel)$'
            - template:
                source: new_job
                template: '{{ if .is_kernel }}kernel{{ end }}'
            - labels:
                job: new_job

      # Auth: eventos de autenticação (ssh, sudo, login, pam)
      - match:
          selector: '{job="system"}'
          stages:
            - regex:
                source: syslog_identifier
                expression: '^(?P<is_auth>sshd|sudo|login|su|systemd-logind|pam_unix)$'
            - template:
                source: new_job
                template: '{{ if .is_auth }}auth{{ end }}'
            - labels:
                job: new_job

      # -----------------------------------------------------------------
      # Classificação de severidade por palavras-chave
      # -----------------------------------------------------------------
      # Nível padrão: INFO
      - static_labels:
          level: INFO

      # WARNING: degraded, retry, timeout, etc.
      - match:
          selector: '{job=~".+"} |~ "(?i)(warn|warning|degraded|retry|timeout)"'
          stages:
            - static_labels:
                level: WARNING

      # ERROR: critical, panic, fatal, failed, OOM, segfault
      - match:
          selector: '{job=~".+"} |~ "(?i)(error|critical|panic|fatal|failed|failure|oom|segfault)"'
          stages:
            - static_labels:
                level: ERROR

      # -----------------------------------------------------------------
      # Extração de ações de autenticação
      # -----------------------------------------------------------------
      # Extrai ações específicas como label para filtragem nos dashboards.
      - match:
          selector: '{job="auth"}'
          stages:
            - regex:
                expression: '.*(?P<action>Failed password|Accepted password|session opened|session closed|sudo:|COMMAND=|Invalid user|Connection closed by authenticating user|authentication failure).*'
            - labels:
                action:

  # ===========================================================================
  # Job: docker — Logs de containers Docker
  # ===========================================================================
  # Usa Docker service discovery para coletar logs de todos os containers
  # automaticamente. Novos containers são detectados a cada 30 segundos.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s    # Intervalo de descoberta de novos containers
    relabel_configs:
      # Extrai metadados do container como labels no Loki
      - source_labels: ['__meta_docker_container_name']
        target_label: container          # Nome do container
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id       # ID único do container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream             # stdout ou stderr
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service    # Nome do serviço no docker-compose
      # Adiciona label de host para consistência com outros jobs
      - target_label: host
        replacement: monitoring-host
      # Define job="docker" explicitamente (docker_sd_configs não herda job_name)
      - target_label: job
        replacement: docker
    pipeline_stages:
      # Nível padrão: INFO
      - static_labels:
          level: INFO
      # Detecta warnings em logs de containers
      - match:
          selector: '{job="docker"} |~ "(?i)(warn|warning|deprecated|retry|timeout)"'
          stages:
            - static_labels:
                level: WARNING
      # stderr não é necessariamente ERROR — muitos apps (Java, Python, Go)
      # escrevem output normal em stderr. Classificamos stderr como WARNING
      # para visibilidade sem poluir contagem de ERRORs reais.
      - match:
          selector: '{job="docker",stream="stderr"}'
          stages:
            - static_labels:
                level: WARNING
      # Detecta erros explícitos em qualquer stream (sobrescreve WARNING acima)
      - match:
          selector: '{job="docker"} |~ "(?i)(error|critical|panic|fatal|failed|exception|traceback)"'
          stages:
            - static_labels:
                level: ERROR
