# =============================================================================
# Grafana — Provisioning de alertas
# =============================================================================
# Este arquivo anteriormente continha regras de alerta baseadas em Loki.
# Com a migração para ELK, os alertas de logs agora devem ser configurados
# diretamente no Kibana (Security → Rules → Detection Rules) para melhor
# integração com o SIEM.
#
# Para criar alertas de logs no Kibana:
#   1. Acesse Kibana → Security → Rules
#   2. Crie regras de detecção baseadas nos índices logs-*
#   3. Use KQL para filtrar: severity:"ERROR" AND source_host:"monitoring-host"
#
# Se preferir manter alertas no Grafana usando o datasource Elasticsearch:
#   1. Crie uma regra manualmente via Grafana UI → Alerting → Alert Rules
#   2. Use o datasource "Elasticsearch" com query sobre logs-*
#   3. Configure threshold por contagem de documentos com severity=ERROR
# =============================================================================

apiVersion: 1

