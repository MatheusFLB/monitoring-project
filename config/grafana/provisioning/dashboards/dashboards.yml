# =============================================================================
# Grafana — Provisioning de dashboards
# =============================================================================
# Configura o Grafana para carregar dashboards automaticamente de arquivos JSON
# localizados no diretório especificado.
#
# Dashboards provisionados:
#   - monitoring-dashboard.json  → Dashboard unificado (infra + logs + rede)
#   - node-exporter-full.json    → Métricas detalhadas do host (CPU, RAM, disco)
#
# Documentação: https://grafana.com/docs/grafana/latest/administration/provisioning/
# =============================================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''                  # Pasta raiz no Grafana
    type: file
    disableDeletion: false      # Permite excluir dashboards via UI
    editable: true              # Permite editar dashboards provisionados
    options:
      # Caminho dentro do container onde os JSONs ficam montados.
      # Corresponde ao volume: ./config/grafana/provisioning → /etc/grafana/provisioning
      path: /etc/grafana/provisioning/dashboards
