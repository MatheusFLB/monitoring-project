# =============================================================================
# Docker Compose — Monitoring + SIEM Stack
# =============================================================================
# Orquestra todos os serviços de monitoramento e SIEM em Docker.
#
# Serviços (12 containers):
#   1.  node-exporter   — Métricas de hardware/SO do host
#   2.  prometheus       — Banco de dados de métricas (time-series)
#   3.  grafana          — Dashboards e visualização unificada
#   4.  zabbix-db        — PostgreSQL para o Zabbix
#   5.  zabbix-server    — Motor de monitoramento de rede
#   6.  zabbix-web       — Interface web do Zabbix
#   7.  zabbix-agent     — Agente local + monitoramento Docker
#   8.  elk-setup        — Container one-shot: gera certificados TLS e senhas
#   9.  elasticsearch    — Motor de busca e SIEM (single-node lab)
#   10. logstash         — Pipeline de ingestão de logs
#   11. kibana           — Interface de análise e SIEM
#
# Redes:
#   - monitoring  → Prometheus, Grafana, Zabbix, Node Exporter
#   - elk         → Elasticsearch, Logstash, Kibana
#   (Grafana conecta nas duas para acessar Elasticsearch como datasource)
#
# Uso:
#   docker-compose up -d            # Subir todos os serviços
#   docker-compose logs -f kibana   # Ver logs de um serviço
#   docker-compose down             # Parar tudo
#
# Variáveis de ambiente: definidas no arquivo .env (ver deploy.sh)
# =============================================================================

services:

  # ===========================================================================
  # BLOCO 1: Métricas — Node Exporter + Prometheus + Grafana
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Node Exporter — Exportador de métricas do host
  # ---------------------------------------------------------------------------
  node-exporter-instancia1:
    image: prom/node-exporter:latest
    container_name: node-exporter-instancia1
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    networks:
      - monitoring
    mem_limit: 128m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus — Banco de dados de métricas (time-series)
  # ---------------------------------------------------------------------------
  prometheus-instancia1:
    image: prom/prometheus:latest
    container_name: prometheus-instancia1
    depends_on:
      - node-exporter-instancia1
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana — Plataforma de visualização e dashboards
  # ---------------------------------------------------------------------------
  # Interface unificada para métricas (Prometheus) e rede (Zabbix).
  # Também pode consultar Elasticsearch para logs, se configurado.
  grafana-instancia1:
    image: grafana/grafana:12.4.3
    container_name: grafana-instancia1
    depends_on:
      - prometheus-instancia1
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
      - elk            # Permite que o Grafana consulte Elasticsearch
    mem_limit: 512m
    restart: unless-stopped

  # ===========================================================================
  # BLOCO 2: Monitoramento de Rede — Zabbix (Server + Web + Agent + DB)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Zabbix DB — PostgreSQL para o Zabbix Server
  # ---------------------------------------------------------------------------
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - monitoring
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix} -d ${ZABBIX_DB_NAME:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix Server — Motor de monitoramento
  # ---------------------------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-32M}
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-3}
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS:-2}
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - ./data/zabbix-server:/var/lib/zabbix
    networks:
      - monitoring
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix Web — Interface de administração
  # ---------------------------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    networks:
      - monitoring
    mem_limit: 256m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix Agent 2 — Agente de monitoramento local
  # ---------------------------------------------------------------------------
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME:-monitoring-host}
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    networks:
      - monitoring
    mem_limit: 128m
    restart: unless-stopped

  # ===========================================================================
  # BLOCO 3: SIEM — ELK (Elasticsearch + Logstash + Kibana)
  # ===========================================================================
  # Substitui Loki + Promtail para centralização e análise de logs.
  # O Elasticsearch 8.x traz segurança (TLS + autenticação) habilitada por padrão.

  # ---------------------------------------------------------------------------
  # ELK Setup — Container one-shot para inicialização de segurança
  # ---------------------------------------------------------------------------
  # Gera certificados TLS (CA + certs) e configura a senha do usuário elastic.
  # Roda apenas uma vez; depois, os outros containers usam os certs gerados.
  elk-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.0}
    container_name: elk-setup
    volumes:
      - elk-certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        # Só gera se o CA ainda não existir
        if [ ! -f config/certs/ca/ca.crt ]; then
          echo ">>> Gerando CA e certificados TLS..."
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip
          unzip config/certs/ca.zip -d config/certs

          # Gera certificados para elasticsearch, kibana e logstash
          cat > config/certs/instances.yml <<INSTANCES
      instances:
        - name: elasticsearch
          dns: [ elasticsearch, localhost ]
          ip: [ 127.0.0.1 ]
        - name: kibana
          dns: [ kibana, localhost ]
          ip: [ 127.0.0.1 ]
        - name: logstash
          dns: [ logstash, localhost ]
          ip: [ 127.0.0.1 ]
      INSTANCES

          bin/elasticsearch-certutil cert --silent --pem \
            --ca-cert config/certs/ca/ca.crt \
            --ca-key config/certs/ca/ca.key \
            --in config/certs/instances.yml \
            -out config/certs/certs.zip
          unzip config/certs/certs.zip -d config/certs
        fi

        # Ajusta permissões para que os containers possam ler
        chown -R 1000:0 config/certs
        find config/certs -type d -exec chmod 750 {} \;
        find config/certs -type f -exec chmod 640 {} \;

        echo ">>> Certificados prontos."
      '
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/ca/ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - elk

  # ---------------------------------------------------------------------------
  # Elasticsearch — Motor de busca, analytics e SIEM
  # ---------------------------------------------------------------------------
  # Configurado como single-node para laboratório residencial.
  #
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ ESCALAR PARA CLUSTER 3 NÓS (produção):                            │
  # │                                                                     │
  # │ 1. Remova discovery.type=single-node                               │
  # │ 2. Adicione 2 containers (es02, es03) com as mesmas configurações  │
  # │ 3. Configure cluster.initial_master_nodes: ["es01","es02","es03"]  │
  # │ 4. Configure discovery.seed_hosts: ["es02","es03"]                 │
  # │ 5. Cada nó precisa de seu próprio volume de dados                  │
  # │ 6. Aumente mem_limit para 4g+ por nó e ES_JAVA_OPTS para -Xms2g   │
  # └─────────────────────────────────────────────────────────────────────┘
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.0}
    container_name: elasticsearch
    depends_on:
      elk-setup:
        condition: service_healthy
    environment:
      - node.name=es01
      - cluster.name=monitoring-siem
      # Single-node: sem eleição de master, ideal para lab com poucos recursos
      - discovery.type=single-node
      # Heap da JVM — metade da mem_limit (nunca mais que 50% da RAM do container)
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # --- Segurança TLS ---
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
    volumes:
      - elk-certs:/usr/share/elasticsearch/config/certs:ro
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk
    # 1.5 GB para o container (512m heap + overhead da JVM + SO)
    mem_limit: 1536m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD:-changeme} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Logstash — Pipeline de ingestão de logs
  # ---------------------------------------------------------------------------
  # Recebe logs via Beats (5044) e Syslog (514 TCP/UDP) e envia para
  # Elasticsearch em índices diários (logs-YYYY.MM.dd).
  #
  # Para escalar: rode múltiplas instâncias atrás de um load balancer.
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.17.0}
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - elk-certs:/usr/share/logstash/config/certs:ro
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"            # Beats input
      - "514:5140/tcp"         # Syslog TCP (host 514 → container 5140, sem root)
      - "514:5140/udp"         # Syslog UDP
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      # Desabilita monitoramento interno do Logstash no ES para economizar recursos
      - xpack.monitoring.enabled=false
    networks:
      - elk
    mem_limit: 768m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kibana — Interface de análise e SIEM
  # ---------------------------------------------------------------------------
  # Dashboards, Discover, SIEM (Security), alertas e Observability.
  # Acessa Elasticsearch via HTTPS com certificados gerados pelo elk-setup.
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.0}
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-changeme}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - SERVER_NAME=kibana
      # Loga em JSON para facilitar ingestão futura
      - LOGGING_ROOT_LEVEL=warn
    volumes:
      - elk-certs:/usr/share/kibana/config/certs:ro
    ports:
      - "5601:5601"
    networks:
      - elk
    mem_limit: 1024m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5601/api/status | grep -q 'available'"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

# =============================================================================
# Volumes nomeados — persistência de dados
# =============================================================================
# Usar volumes Docker nomeados em vez de bind mounts para:
#   - Melhor performance em Linux (sem overhead de mapeamento de UID)
#   - Gerenciamento via `docker volume ls / inspect / prune`
#   - Backup com `docker run --rm -v vol:/data -v $(pwd):/bak alpine tar czf /bak/vol.tgz /data`
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  zabbix-db-data:
    driver: local
  elasticsearch-data:
    driver: local
  elk-certs:
    driver: local

# =============================================================================
# Redes
# =============================================================================
# Duas redes isolam tráfego por domínio:
#   - monitoring: métricas e Zabbix
#   - elk: SIEM (Elasticsearch, Logstash, Kibana)
# Grafana conecta nas duas redes para poder consultar ambos os backends.
networks:
  monitoring:
    driver: bridge
  elk:
    driver: bridge
