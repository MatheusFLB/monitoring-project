version: '3.8'

services:

  # ============================================================
  # Prometheus / Grafana / Node Exporter  (stack original)
  # ============================================================

  node-exporter-instancia1:
    image: prom/node-exporter:latest
    container_name: node-exporter-instancia1
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    networks:
      - monitoring-network
    restart: unless-stopped

  prometheus-instancia1:
    image: prom/prometheus:latest
    container_name: prometheus-instancia1
    depends_on:
      - node-exporter-instancia1
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring-network
    restart: unless-stopped

  grafana-instancia1:
    image: grafana/grafana:latest
    container_name: grafana-instancia1
    depends_on:
      - prometheus-instancia1
      - loki
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning
      - ./grafana_data:/var/lib/grafana
    networks:
      - monitoring-network
    restart: unless-stopped

  # ============================================================
  # Zabbix  (monitoramento de rede e hosts remotos)
  # ============================================================

  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    volumes:
      - ./zabbix_db_data:/var/lib/postgresql/data
    networks:
      - monitoring-network
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server
    depends_on:
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-32M}
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-3}
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS:-2}
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - ./zabbix_server_data:/var/lib/zabbix
    networks:
      - monitoring-network
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    networks:
      - monitoring-network
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME:-monitoring-host}
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    networks:
      - monitoring-network
    restart: unless-stopped

  # ============================================================
  # Loki + Promtail  (logs e eventos de segurança)
  # ============================================================

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki:/etc/loki
      - ./loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail:/etc/promtail
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-network
    restart: unless-stopped

networks:
  monitoring-network:
    driver: bridge