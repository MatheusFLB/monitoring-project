# =============================================================================
# Docker Compose — Monitoring Stack
# =============================================================================
# Orquestra todos os serviços de monitoramento em uma única rede Docker.
#
# Serviços (9 containers):
#   1. node-exporter  — Métricas de hardware/SO do host
#   2. prometheus      — Banco de dados de métricas (time-series)
#   3. grafana         — Dashboards e visualização unificada
#   4. zabbix-db       — PostgreSQL para o Zabbix
#   5. zabbix-server   — Motor de monitoramento de rede
#   6. zabbix-web      — Interface web do Zabbix
#   7. zabbix-agent    — Agente local + monitoramento Docker
#   8. loki            — Agregador de logs
#   9. promtail        — Coletor de logs
#
# Uso:
#   docker-compose up -d            # Subir todos os serviços
#   docker-compose logs -f grafana  # Ver logs de um serviço
#   docker-compose down             # Parar tudo
#
# Variáveis de ambiente: definidas no arquivo .env (ver .env.example)
# =============================================================================

services:

  # ===========================================================================
  # BLOCO 1: Métricas — Node Exporter + Prometheus + Grafana
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Node Exporter — Exportador de métricas do host
  # ---------------------------------------------------------------------------
  # Expõe métricas do sistema operacional (CPU, memória, disco, rede) no
  # formato Prometheus. O Prometheus faz scrape dessas métricas a cada 15s.
  node-exporter-instancia1:
    image: prom/node-exporter:latest
    container_name: node-exporter-instancia1
    volumes:
      - /:/host:ro              # Monta o filesystem do host (somente leitura)
    command:
      - '--path.rootfs=/host'   # Aponta para o root filesystem montado
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    networks:
      - monitoring-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prometheus — Banco de dados de métricas (time-series)
  # ---------------------------------------------------------------------------
  # Coleta métricas dos exporters configurados e armazena com retenção de 30 dias.
  # Interface web disponível na porta configurada (padrão: 9090).
  prometheus-instancia1:
    image: prom/prometheus:latest
    container_name: prometheus-instancia1
    depends_on:
      - node-exporter-instancia1
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus        # Configuração de scrape
      - ./data/prometheus:/prometheus               # Dados persistentes (TSDB)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'        # Retenção de 30 dias
    networks:
      - monitoring-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Grafana — Plataforma de visualização e dashboards
  # ---------------------------------------------------------------------------
  # Interface unificada para métricas (Prometheus), logs (Loki) e rede (Zabbix).
  # Dashboards e datasources são provisionados automaticamente via arquivos YAML.
  #
  # O plugin Zabbix é instalado pelo entrypoint Docker (GF_INSTALL_PLUGINS)
  # antes do Grafana iniciar, garantindo que o datasource type esteja disponível
  # para o provisioning.
  grafana-instancia1:
    image: grafana/grafana:latest
    container_name: grafana-instancia1
    depends_on:
      - prometheus-instancia1
      - loki
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # Instala o plugin Zabbix via entrypoint Docker (antes do Grafana iniciar).
      # O datasource Zabbix deve ser configurado via UI/API após o startup
      # devido a race condition no provisioning YAML do Grafana 13+.
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning  # Provisioning
      - ./data/grafana:/var/lib/grafana                          # Dados persistentes
    networks:
      - monitoring-network
    restart: unless-stopped

  # ===========================================================================
  # BLOCO 2: Monitoramento de Rede — Zabbix (Server + Web + Agent + DB)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Zabbix DB — PostgreSQL para o Zabbix Server
  # ---------------------------------------------------------------------------
  # Armazena configurações, histórico de métricas e inventário de hosts.
  # Senha gerada automaticamente pelo deploy.sh.
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    volumes:
      - ./data/zabbix-db:/var/lib/postgresql/data    # Dados do PostgreSQL
    networks:
      - monitoring-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix Server — Motor de monitoramento
  # ---------------------------------------------------------------------------
  # Gerencia coleta de dados de hosts monitorados (com ou sem agente).
  # Porta 10051: comunicação com Zabbix Agents remotos.
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server
    depends_on:
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-32M}          # Cache de configuração
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-3}       # Threads de polling
      ZBX_STARTPINGERS: ${ZBX_STARTPINGERS:-2}       # Threads de ICMP ping
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - ./data/zabbix-server:/var/lib/zabbix         # Estado do servidor
    networks:
      - monitoring-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix Web — Interface de administração
  # ---------------------------------------------------------------------------
  # Painel web para configurar hosts, templates, triggers e visualizar dados.
  # Também serve como proxy da API JSON-RPC usada pelo plugin Grafana.
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    networks:
      - monitoring-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix Agent 2 — Agente de monitoramento local
  # ---------------------------------------------------------------------------
  # Coleta métricas detalhadas do host local e containers Docker.
  # Comunicação ativa com o Zabbix Server (não precisa de porta exposta).
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME:-monitoring-host}
    volumes:
      - /:/host:ro                                   # Filesystem do host
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Métricas de containers
    privileged: true           # Necessário para acesso completo a métricas do host
    networks:
      - monitoring-network
    restart: unless-stopped

  # ===========================================================================
  # BLOCO 3: Logs — Loki + Promtail
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Loki — Agregador de logs
  # ---------------------------------------------------------------------------
  # Recebe logs do Promtail, indexa por labels e disponibiliza para
  # consulta via LogQL no Grafana. Retenção de 30 dias.
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki:/etc/loki          # Configuração do Loki
      - ./data/loki:/loki                # Dados persistentes (chunks + índices)
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Promtail — Coletor de logs
  # ---------------------------------------------------------------------------
  # Lê logs de arquivos do sistema e containers Docker, classifica por
  # severidade e envia para o Loki. Detecta novos containers automaticamente.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./config/promtail:/etc/promtail                # Configuração
      - /var/log:/var/log:ro                           # Logs do host (syslog, auth, kern)
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Discovery de containers
    networks:
      - monitoring-network
    restart: unless-stopped

# =============================================================================
# Rede — Todos os serviços na mesma rede bridge
# =============================================================================
# Permite comunicação entre containers usando nomes de serviço como hostname.
# Exemplo: o Grafana acessa o Prometheus via http://prometheus-instancia1:9090
networks:
  monitoring-network:
    driver: bridge
