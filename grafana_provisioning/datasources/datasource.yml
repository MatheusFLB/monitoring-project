apiVersion: 1

datasources:
  - name: Prometheus-Instancia1
    type: prometheus
    access: proxy
    url: http://prometheus-instancia1:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
      trends: true
      trendsFrom: "7d"
      trendsRange: "4d"
      dbConnectionEnable: false
    secureJsonData:
      password: zabbix
