global:
  scrape_interval: 15s

scrape_configs:
  # ── Métricas da máquina central ──
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter-instancia1:9100']
        labels:
          instance: 'instancia1'

  # ── Self-monitoring do Prometheus ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Health check do Loki ──
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
