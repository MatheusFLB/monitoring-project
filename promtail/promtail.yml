server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Logs do sistema (auth, syslog, kern) ──────────────────
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          host: monitoring-host
          __path__: /var/log/syslog
      - targets:
          - localhost
        labels:
          job: auth
          host: monitoring-host
          __path__: /var/log/auth.log
      - targets:
          - localhost
        labels:
          job: kernel
          host: monitoring-host
          __path__: /var/log/kern.log

  # ── Logs de containers Docker ─────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service

  # ── Detecção de eventos de segurança ──────────────────────
  - job_name: security
    static_configs:
      - targets:
          - localhost
        labels:
          job: security
          host: monitoring-host
          __path__: /var/log/auth.log
    pipeline_stages:
      - match:
          selector: '{job="security"}'
          stages:
            - regex:
                expression: '(?P<action>Failed password|Accepted password|session opened|session closed|sudo:|COMMAND=|Invalid user|Connection closed by authenticating user)'
            - labels:
                action:
